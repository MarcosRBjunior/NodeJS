services:
  postgres:
    image: postgres:18
    container_name: bordeless-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bordeless
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - bordeless-pgdata:/var/lib/postgresql
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bordeless-pgdata:
